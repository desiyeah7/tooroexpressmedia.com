<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Owner Dashboard - Live Stream</title>
<style>
  body { font-family: Arial, sans-serif; display: flex; flex-direction: column; align-items: center; margin: 20px; }
  #videoContainer { position: relative; }
  #liveVideo { width: 640px; height: 360px; background-color: black; }
  #programTitle { font-size: 24px; color: #ff6600; margin: 10px 0; white-space: nowrap; overflow: hidden; }
  #chatContainer { margin-top: 20px; width: 640px; }
  #messages { border: 1px solid #ccc; height: 150px; overflow-y: scroll; padding: 10px; margin-bottom: 10px; background: #f9f9f9;}
  #likesContainer { margin-top: 10px; font-size: 18px; }
  #controls { margin-top: 10px; display: flex; gap: 10px; }
  #controls input { padding: 5px; font-size: 16px; }
  button { padding: 8px 15px; font-size: 16px; cursor: pointer; border-radius: 5px; border: none; background-color: #ff6600; color: white; }
  button:hover { background-color: #ff4500; }
</style>
</head>
<body>

<h1>Owner Dashboard - Live Stream</h1>

<div id="programTitleContainer">
  <div id="programTitle">Program Title</div>
</div>

<div id="videoContainer">
  <video id="liveVideo" autoplay></video>
</div>

<div id="controls">
  <input type="text" id="titleInput" placeholder="Enter program title" />
  <button id="setTitleBtn">Set Title</button>
  <button id="startBtn">Start Stream</button>
  <button id="stopBtn">Stop & Upload Recording</button>
</div>

<div id="likesContainer">Likes: <span id="likeCount">0</span></div>

<div id="chatContainer">
  <h3>Viewer Chat</h3>
  <div id="messages"></div>
</div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-storage-compat.js"></script>

<script>
  // ===== Initialize Firebase =====
  const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
    databaseURL: "https://YOUR_PROJECT_ID-default-rtdb.firebaseio.com",
    projectId: "YOUR_PROJECT_ID",
    storageBucket: "YOUR_PROJECT_ID.appspot.com",
    messagingSenderId: "SENDER_ID",
    appId: "APP_ID"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();
  const storage = firebase.storage();

  const video = document.getElementById('liveVideo');
  let mediaStream;
  let mediaRecorder;
  let recordedChunks = [];

  // ===== Start Stream =====
  document.getElementById('startBtn').addEventListener('click', async () => {
    mediaStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
    video.srcObject = mediaStream;

    // Start recording
    recordedChunks = [];
    mediaRecorder = new MediaRecorder(mediaStream);
    mediaRecorder.ondataavailable = e => { if(e.data.size > 0) recordedChunks.push(e.data); };
    mediaRecorder.start();
    alert("Live stream started and recording!");
  });

  // ===== Stop & Upload Recording =====
  document.getElementById('stopBtn').addEventListener('click', async () => {
    if(mediaRecorder && mediaRecorder.state !== "inactive") {
      mediaRecorder.stop();
      mediaStream.getTracks().forEach(track => track.stop());

      // Combine chunks and upload
      const blob = new Blob(recordedChunks, { type: "video/webm" });
      const title = document.getElementById('titleInput').value || "Untitled";
      const filename = `recorded_${Date.now()}.webm`;
      const storageRef = storage.ref().child(`recordedVideos/${filename}`);
      await storageRef.put(blob);
      const url = await storageRef.getDownloadURL();

      // Save metadata to database
      db.ref('recordedVideos').push({ title, url, timestamp: Date.now() });

      alert("Recording uploaded successfully!");
    }
  });

  // ===== Program Title =====
  const titleInput = document.getElementById('titleInput');
  const setTitleBtn = document.getElementById('setTitleBtn');
  const programTitle = document.getElementById('programTitle');

  setTitleBtn.addEventListener('click', () => {
    const title = titleInput.value.trim();
    if(title) db.ref('programTitle').set(title);
  });

  // ===== Display Scrolling Program Title =====
  db.ref('programTitle').on('value', snapshot => {
    const text = snapshot.val() || "No title set";
    programTitle.textContent = text;
    programTitle.style.animation = 'scroll 15s linear infinite';
  });

  // CSS scroll animation
  const style = document.createElement('style');
  style.innerHTML = `
    @keyframes scroll {
      0% { transform: translateX(100%); }
      100% { transform: translateX(-100%); }
    }
    #programTitle { display: inline-block; white-space: nowrap; }
  `;
  document.head.appendChild(style);

  // ===== Likes =====
  const likeRef = db.ref('likes');
  const likeCountElem = document.getElementById('likeCount');
  likeRef.on('value', snapshot => { likeCountElem.innerText = snapshot.val() || 0; });

  // ===== Viewer Chat =====
  const messagesRef = db.ref('chatMessages');
  const messages = document.getElementById('messages');
  messagesRef.on('child_added', snapshot => {
    const data = snapshot.val();
    const div = document.createElement('div');
    div.textContent = `${data.user}: ${data.text}`;
    messages.appendChild(div);
    messages.scrollTop = messages.scrollHeight;
  });
</script>
</body>
</html>
