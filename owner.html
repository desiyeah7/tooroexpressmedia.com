<style>
body {margin:0;font-family:Arial ,sans-serif;background:#1a1a1a;color:#fff;}
  #loginBox {text-align:center; margin-top:50px;}
   #ownerPanel {display:none;padding:20px;max-width:900px;margin:auto;}

margin-top:20px;}
  .bg-media {position:absolute;width:100%;height:100%;
object-fit:cover;z-index:1;display:none;}
      #liveVideo{ position:absolute;bottom:15px;
    right:15px;width:25px;border-radius:10px;

    .title-bar{position:absolute;top:0;width:100%;

  #programTitle  {white-space:nowrap;padding-left:100%;animation:scrollTitle 15s linear infinite;color:#b7ffb7;

 </style>

<body>
<!--Login-->
<div id="loginBox">
<h2>verify your identity</h2>
<input type="email" id="email"Placeholder="Email" />
<input type="password" id="password" placeholder="password"/>
<button onclick="login()">Login</button>
<buttton onclick="resetpassword()">ForgotpPassword?</button>
</div>

<!--ownerPanel-->
<div id="ownerPanel">
<h1>Live Sreeam Owner Dashboard</h1>
<button onclick="auth.SignOut()">LogOut</button>

<!--Video Preview & Logo-->
<div class="video-wrapper">
<div class="tittle-bar">

<img scr="IMG-20251213-WA0009.jpg" id="logoOverlay">

<video id="LiveVideo"autoplay playsinline></video>

<!--Program Title-->

<button onclick="setTitle()">Set Title</button>
</div>

<!--Background Media-->
<div style="margin-top:10px;">
<input type="file" accept="image/*.video/*" onchange="uploadBackground(this)">
<button onclick="clearBackground()">Remove Background</button>
</div>


<!--Recorded Videos-->
<h2>Last Events</h2>
<input type="file" accept="video/*" onchange="uploadvideo(this)">
<div id="recordedVideos"></div>

<!--Change Password-->
<div style="margin-top:20px;">
<input type="password" id="newPassword" placeholder="New Password">
<button onclick="changePassword()">Change Password</button>
</div>
</div>

<!--Firebase SDK-->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compact.js"></script>

<script>

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>

<script>
  <!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

<script>
  // Firebase config (PASTE YOUR REAL VALUES HERE)
  const firebaseConfig = {
    apiKey: "PASTE_API_KEY_HERE",
    authDomain: "PASTE_PROJECT_ID.firebaseapp.com",
    projectId: "PASTE_PROJECT_ID",
    messagingSenderId: "PASTE_SENDER_ID",
    appId: "PASTE_APP_ID"
  };

  // Initialize Firebase (ONLY ONCE)
  firebase.initializeApp(firebaseConfig);

  // Login function
  function login() {
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    firebase.auth().signInWithEmailAndPassword(email, password)
      .then(() => {
        alert("Login successful");
      })
      .catch(error => {
        alert(error.message);
      });
  }
</script>

</script>
