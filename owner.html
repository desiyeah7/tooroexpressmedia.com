<script>

//Initializing Firebase
const firebaseConfig={
apikey:"YOUR_API_KEY",
authDomain:
"YOUR_PROJECT.firebaseapp.com",
databaseURL:
"https://YOUR_PROJECT-default-rtdb.firebaseio.com",
projectId: "YOUR_PROJECT",
storageBucket:
"YOUR_PROJECT.appspot.com",
messagingSenderId: "XXXX",
appId: "XXXX"
};

firebase.initializedApp(firebaseConfig);
const auth=firebase.auth()
const db=firebase.database()p;
const storage=firebase.storage();

//Login
function login(){
const email=
document.getElementById("email").value;
const password=
document.getElementById("password").value;


auth.signInWithEmailAndPassword(email,password)
.then(()=>{document.getElementById("loginBox").style.display="none";
document.getElementById("ownerPanel").style.display="block";
alert("Login Successful!);})
   .catch(err=>alert(err.messsage));
}

//Password reset
function resetPassword(){
const email=
document.getElementById("email").value;
  if(!email)return alert("Enter your email first");
auth.sendPasswordResetEmail(email)
  .then(()=>alert("Password reset email sent!"))
       .catch(err=>alert(err.message));
}

//Auth state change
auth.onAuthStateChanged(user=>{
if(user)
{document.getElementById("loginBox").style.dispaly="none";
document.getElementById("ownerPanel").style.dispaly="block";}

else{document.getElementById("loginBox").style.dispaly="block";
document.getElementById("ownerPanel").style.dispaly="none";}
});

//Change password
function ChangePassword(){
const user=auth.currentUser;
const newPassword=
document.getElementById("newPassword").value;

if(newPassword) return
alert("Enter a new password");

user.updatePassword(newPassword)
      .then(()=>alert ("Password changed successfully!"))
    .catch(err=>alert(err.message));
}

//Program title
function setTitle(){
const  title="document.getElementById("titleInput").value;

db.ref("programTitle").set(title);
}


//  background upload
function upoloadBackground(input){
const file=input.files[0]; if (!file) return;
     const
ref=storage.ref("background/current");

ref.put(file).then(()=>ref.getDownloadURL().then(url=>db.ref("background").set({url:url,type:file.type.startsWith
("video")?"video":"image"})
));

}
function clearBackground(){ db.rel("background").remove();}


//  upload recorded video
function uploadVideo(input){
const file=input.files[0]; if (!file) return;
const videoId=Date.now();
const
ref=storage.ref(`recordedVideos/${videoId}`);

ref.put(file).then(()=>ref.getDownloadURL().then(url=>{db.ref(`recordedVideos/${videoId}`)
. set({title:file.name,url:url});
}));
}



// Dispaly recorded videos & delete fully
const
recordedDiv=document.getElementById("recordedVideos");

db.ref("recordedVideos").on(child_added", snap=>{
  const data=snap.val();const
key=snap.key;
 const
card=document.createElement("div");
card.className="video-card";
const
title=document.createElement("h4");
title.textContent=data.title;
title.style.color="#a8f0a5";
const
vid=document.createElement("video");
vid.src=data.url;
vid.controls=true;
vid.style.width="100%";
const
delBtn=document.createElement("button");
delBtn.textContent="Delete";
delBtn.onclick=()=>{
storage.ref(`recordedVideos/${key}`)
.delete().then(()=> db.ref(`recordedVideos/${key}`).remove())
   .catch(err=>alert("Error deleting video: "+err.message));
};
card.appendChild(title);
card.appendChild(vid);
card.appendChild(delBtn);
recordedDiv.appendChild(card);
});
</script>
